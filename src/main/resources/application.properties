spring.application.name=ensam-chatbot
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/linkedin_ensam}
spring.data.mongodb.database=${MONGODB_DATABASE:linkedin_ensam}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.1:8b}
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
ollama.response-timeout=${OLLAMA_RESPONSE_TIMEOUT:30s}

spring.mvc.async.request-timeout=${HTTP_REQUEST_TIMEOUT:35s}
springdoc.swagger-ui.path=/swagger-ui.html
